# Daily sweep on GitHub's runners instead of a laptop.
#
# The whole reason this needs a DATABASE_URL: closure detection works by
# diffing today's full board against the *stored* open set, and a runner is
# ephemeral. With no persistent database every job looks new every day, nothing
# ever closes, and first_seen_at resets — the one feature this index exists for
# stops working while appearing to succeed. So the first step refuses to run
# without one rather than quietly producing a fresh, wrong index and publishing
# it over the good one.
name: Sweep and publish

on:
  schedule:
    # Every six hours. `stalest` ranks boards by how overdue they are against
    # their *own* interval, so a run fetches only what is genuinely due — the
    # ~190 boards that post Australian data roles every 8h, the tail every 4
    # days — and the extra runs cost roughly what the hot tier costs rather
    # than a multiple of the whole index.
    #
    # This was every four hours, and that was fiction. A run takes 4-5 hours
    # (measured: 183 boards in 17,696s), so the 4-hourly slots queued against
    # the `reqtrace-pipeline` concurrency group and GitHub — which keeps only
    # ONE pending run per group — discarded the older pending one each time.
    # Six scheduled runs produced four actual runs a day, and the two it threw
    # away were invisible: nothing failed, the count was simply wrong. The
    # crawl lost the same argument from the other side and was cancelled
    # outright on four occasions.
    #
    # Six hours is what the sweep can actually hold, so the schedule now says
    # what happens. Running more often than the shortest interval is still the
    # point — it decouples "when a board becomes due" from "when a run
    # happens", so a board due at 06:00 waits at most 6 hours rather than
    # until the next daily slot — but claiming a cadence the job cannot finish
    # in buys nothing and hides the crawl being squeezed out.
    #
    # 18:30 UTC = 04:30 in Sydney during AEST, so the overnight slot that
    # feeds the morning view is still one of the four.
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      max_boards:
        description: "Cap boards per vendor (0 = all). Use a small number to test."
        required: false
        default: "0"
      budget:
        description: "Cap on boards per run (0 = every board that is due)."
        required: false
        default: "400"
      publish:
        description: "Push the export to gh-pages"
        type: boolean
        default: true

env:
  # stdout is a pipe under Actions, so Python block-buffers it and a job that
  # is killed loses the last few KB unflushed. That is precisely the log you
  # need: a cancelled sweep once looked like it had reconciled nothing for two
  # and a half hours when it had simply never flushed.
  PYTHONUNBUFFERED: "1"

concurrency:
  # Never two sweeps at once: they would interleave writes into the same
  # database and each would see a half-updated open set to diff against.
  # Shared with crawl.yml for the same reason — see the note there.
  group: reqtrace-pipeline
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Measured on real runs, not guessed: 357 boards took 134-164 minutes on
    # this runner, so ~25.5s a board. (A local measurement said 59s; GitHub's
    # network to these vendors is about 2.3x better than a laptop's.)
    #
    # Per-job cost also varies ~4x between Workday tenants (0.060, 0.097 and
    # 0.241 s/job on three boards over 500 jobs) and does not track board size
    # or AU-role count — the fastest had the most Australian roles, the slowest
    # the fewest. It is tenant latency, so no precise model is worth trusting.
    #
    # Hence --budget is a generous cap rather than a tuning knob (boards that
    # are not due are skipped, so a spare budget costs nothing) and --deadline
    # does the bounding. A typical run is ~170 due boards, about 75 minutes.
    #
    # This ceiling is 350, near GitHub's 6-hour job limit, because 210 was
    # leaving most of the budget unused while the sweep ran out of time: the
    # first scheduled run to complete on the batching code did 80 of 181 due
    # boards and skipped 101, having spent 188 minutes on 123 Workday tenants.
    # Boards skipped for time are safe -- they stay due and sort first next
    # run -- but a sweep that covers under half of what is due each cycle
    # never catches up while the crawler keeps adopting.
    #
    # --deadline has to stay well under this rather than near it. The deadline
    # only stops boards *starting*: with CONCURRENCY=4 four boards can begin a
    # second before it and each run the 25-minute BOARD_TIMEOUT, then the
    # chunk they are in has to be written, and the export and publish steps
    # still have to fit afterwards. Measured once, that overshoot was 48
    # minutes (a 140-minute deadline produced a 188-minute sweep step), so
    # --deadline 270 lands around 320 and leaves roughly 30 minutes of slack.
    # Raising the deadline and BOARD_TIMEOUT together will run out of room.
    #
    # Overrunning this is no longer silently wasted work: the sweep reconciles
    # in batches as boards finish (FLUSH_EVERY), so a run cancelled here keeps
    # everything it had already fetched and the next run resumes past it.
    timeout-minutes: 350
    permissions:
      contents: write      # pushes the export to the gh-pages branch

    steps:
      - name: Refuse to run without a database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL secret. A runner has no persistent" \
              "storage, so a sweep without one would mark every job new, close" \
              "nothing, and reset first_seen_at — then publish that over the" \
              "working site. Add the secret (Settings -> Secrets -> Actions)" \
              "before enabling this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # Adoption deliberately does NOT happen here. It writes
      # `data/discovered_boards.csv` and then marks those findings adopted in
      # the database, so running it on a runner that throws its checkout away
      # would persist the "already adopted" flag while discarding the only
      # record of what was adopted — the board would never be offered again and
      # never be swept. `crawl.yml` runs it and commits the file in one step.
      - name: Sweep every board
        id: sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m reqtrace.run --vendor all \
            --max-boards "${{ inputs.max_boards || 0 }}" \
            --budget "${{ inputs.budget || 400 }}" \
            --deadline 270

      - name: Build the static export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/export_static.py

      - name: Publish to gh-pages
        # Not `inputs.publish != false`: a scheduled run carries no inputs, so
        # that condition is false on exactly the runs this workflow exists for
        # — the sweep and the export both succeed, the export is discarded with
        # the runner, and the site silently serves the previous day's index
        # while Actions stays green. The dispatch input still opts out.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python scripts/export_static.py --publish --allow-dirty

      - name: Report what the sweep did
        # always(), but only once there is something to report. Plain always()
        # runs this even when the DATABASE_URL guard aborted the job, where it
        # fails with "uv: command not found" and buries the real error under a
        # second, meaningless one.
        if: always() && steps.sweep.outcome != 'skipped'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, psycopg, sys
          sys.path.insert(0, "src")
          from reqtrace import runs
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              c.execute("SET TIME ZONE 'UTC'")
              s = runs.summary(c, backend="postgres")
          print(f"| boards | complete | incomplete | failed | stale | new | closed |")
          print(f"|---|---|---|---|---|---|---|")
          print(f"| {s['boards']} | {s['ok']} | {s['incomplete']} | {s['failed']} "
                f"| {s['stale']} | {s['new']} | {s['closed']} |")
          print(f"\nLast board fetched: {s['last_run']}")
          # `stale` is a count, so it reads 0 until the moment it reads 1 and
          # tells you nothing on the way there. This run skips boards for time
          # every pass, and the question that actually matters is whether the
          # backlog is gaining on the five-day threshold or losing to it — so
          # print the margin, which moves every run, rather than the count,
          # which does not move until it is too late to be news.
          age, cap = float(s["oldest_age_hours"]), s["stale_hours"]
          margin = s["stale_margin_hours"]
          mark = ":white_check_mark:" if margin > 24 else (
                 ":warning:" if margin > 0 else ":x:")
          print(f"\nStalest board: {age:.1f}h against a {cap}h threshold "
                f"— {margin:.1f}h of margin. {mark}")
          PY
