<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 157.41 33.20"
     width="157" height="33" fill="none" color="#5980a6"
     role="img" aria-label="Muster">
  <!-- The mark and the word as one object, which is the whole reason this file
       exists: set as HTML text the word renders in Barlow Condensed only where
       Barlow Condensed loads, and these pages ship as a static export meant to
       open from disk with no network. An outline cannot fall back to the system
       face, so the lockup looks the same everywhere or not at all.

       Rebuilding it: Barlow Condensed SemiBold (600), the face the pages already
       set as their heading token, "MUSTER" in caps at .02em — the nav's own
       letter-spacing. Cap height is 24.59 of these units, the mark's visual
       height over 1.35. The 15 between them is the length of the race, which is
       also the clear space the mark asks for, and it is measured ink to ink:
       the M's left sidebearing is taken out first, or the gap reads wider than
       it is. The box is tight to the ink on all four sides. The font is not
       vendored here — these are outlines, and nothing at render time needs it.

       `color` and `currentColor` behave as in `muster.svg`: fetched on its own
       it is the Industry accent, inlined it takes whatever sets `color`. -->
  <g transform="translate(-1.4 -7.4)" stroke="currentColor" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
